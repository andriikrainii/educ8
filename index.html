  // Merge two states: union of results per student per day, keeping the record with the latest completedAt.
  function mergeStates(a,b){a=normState(a);b=normState(b);var out={results:{},settings:Object.assign({},a.settings,b.settings),v:Math.max(a.v,b.v)};
    [a,b].forEach(function(st){Object.keys(st.results).forEach(function(sid){out.results[sid]=out.results[sid]||{};var days=st.results[sid]||{};Object.keys(days).forEach(function(did){var rec=days[did];var ex=out.results[sid][did];if(!ex||(rec&&(rec.completedAt||0)>(ex.completedAt||0)))out.results[sid][did]=rec;});});});
    return out;}

  function norm(x){return String(x).toLowerCase().trim().replace(/['’‘`.!,]/g,"").replace(/\s+/g," ").replace(/ё/g,"е");}
  function loose(x){return norm(x).replace(/[иіїй]/g,"i").replace(/ґ/g,"г").replace(/ь/g,"");}
  // Keyboard-layout rescue: a Ukrainian answer typed with the English layout on (or the reverse).
  var K_EN2UA={q:"й",w:"ц",e:"у",r:"к",t:"е",y:"н",u:"г",i:"ш",o:"щ",p:"з","[":"х","]":"ї",a:"ф",s:"і",d:"в",f:"а",g:"п",h:"р",j:"о",k:"л",l:"д",";":"ж","'":"є",z:"я",x:"ч",c:"с",v:"м",b:"и",n:"т",m:"ь",",":"б",".":"ю","/":".","<":"б",">":"ю",":":"ж"};
  var K_UA2EN={};(function(){for(var k in K_EN2UA){if(!(K_EN2UA[k] in K_UA2EN))K_UA2EN[K_EN2UA[k]]=k;}})();
  function conv(x,m){return String(x).toLowerCase().split("").map(function(c){return m[c]||c;}).join("");}
  function isCorrect(qq,val){
    if(val==null||val==="")return false;
    if(qq.t==="num"){var n=parseFloat(String(val).replace(",","."));return !isNaN(n)&&n===qq.a;}
    var cands=[val,conv(val,K_EN2UA),conv(val,K_UA2EN)];
    return qq.a.some(function(a){
      var na=norm(a),la=loose(a);
      return cands.some(function(cv){
        var v=norm(cv),lv=loose(cv);
        if(na===v||la===lv)return true;
        if(lv.split(" ").indexOf(la)>=0)return true;
        return false;
      });
    });
  }
  function fmtTime(ms){var s=Math.round(ms/1000);if(s<60)return s+" с";return Math.floor(s/60)+" хв "+(s%60)+" с";}
  function fmtShort(ms){var s=Math.round(ms/1000);if(s<60)return s+"с";return Math.floor(s/60)+"хв "+(s%60)+"с";}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function persist(after,cb){

    }).catch(function(){syncMode="local";});
  }

  function buildSteps(d){
    var order=["m","e","g","h"],byS={m:[],e:[],g:[],h:[]},steps=[];
    d.qs.forEach(function(q){byS[q.s].push(q);});
    order.forEach(function(s){if(byS[s].length){if(d.theory&&d.theory[s])steps.push({theory:true,s:s});byS[s].forEach(function(q){steps.push({q:q});});}});
    return steps;
  }
  function startDay(d){run={day:d,steps:buildSteps(d),si:0,records:[],startAt:Date.now()};run.nq=run.steps.filter(function(x){return x.q;}).length;timerInt=setInterval(updTimer,1000);renderStep();}

  }
  function showReport(studentId,dayId){
    var d=null;DAYS.forEach(function(x){if(x.id===dayId)d=x;});var rep=(state.results[studentId]||{})[dayId];if(!d||!rep){renderHome();return;}
    var tot=rep.total||0,pctv=tot?Math.round(rep.correct/tot*100):0,nq=rep.records.length;
    var openTxt=rep.openCount?(' · +'+rep.openCount+' письмових на перевірку'):'';
    var html='<div class="wrap"><div class="run-top"><button class="x" id="rx2">✕</button><div class="meta"><div class="t">'+studName(studentId)+' · '+d.title+'</div><div class="p">'+new Date(rep.completedAt).toLocaleString("uk-UA")+'</div></div></div>'+
      '<div class="rep-hero"><div class="big">'+rep.correct+'/'+tot+'</div><div class="lbl">правильних'+(tot?' · '+pctv+'%':'')+openTxt+'</div>'+
      '<div class="rep-stats"><div class="st"><b>'+fmtTime(rep.totalMs)+'</b>увесь урок</div><div class="st"><b>'+fmtShort(rep.totalMs/(nq||1))+'</b>у середньому/питання</div></div></div>';
    html+='<div class="subj-tot">';["m","e","g","h"].forEach(function(k){var p=rep.perSub[k];if(!p.n&&!p.open)return;var sub=SUB[k];var line=(p.n?p.c+'/'+p.n+' правильно':'')+(p.open?((p.n?' · ':'')+p.open+' письм.'):'')+' · '+fmtTime(p.ms);html+='<div class="s '+sub[2]+'"><h4>'+sub[0]+'</h4><p>'+line+'</p></div>';});html+='</div>';
    html+=qrows(rep);
    html+='<div class="toolbar"><button class="bigbtn" id="done">Готово</button></div></div>';
    root.innerHTML=html;
    document.getElementById("rx2").onclick=function(){tab="lessons";renderHome();};
    document.getElementById("done").onclick=function(){tab="lessons";renderHome();};
  }
  function suspicious(r){if(r.skipped||r.open)return r.pasted?true:false;if(r.pasted)return true;var ks=r.keystrokes||0;if((r.chars||0)>=8&&r.ms<1200&&ks<r.chars*0.4)return true;return false;}
  function metaBadges(r){
    if(r.skipped)return '<span class="pill">⏭ пропущено</span>';
    var out='<span class="pill">⏱ '+fmtShort(r.ms)+'</span>';
    out+=r.pasted?'<span class="pill badge-paste">📋 вставлено'+((r.pasteCount||0)>1?' ×'+r.pasteCount:'')+'</span>':'<span class="pill badge-in">⌨ вручну</span>';
    if((r.edits||0)>0)out+='<span class="pill badge-edit">✎ '+r.edits+' прав.</span>';
    if(suspicious(r))out+='<span class="pill badge-warn">⚠ перевір</span>';
    return out;
  }
  function qrows(rep){
    var html="";
    rep.records.forEach(function(r){var sub=SUB[r.s];
      var markCls=r.open?"open":(r.correct?"ok":"bad"),markCh=r.open?"✎":(r.correct?"✓":"✕");
      html+='<div class="qrow"><div class="top2"><span class="mk '+markCls+'">'+markCh+'</span><span class="qn">'+r.q+'</span><span class="tag2 '+sub[1]+'">'+sub[0]+'</span></div>';
      if(r.open){
        html+=r.skipped?'<div class="ans-line"><span class="yn">Пропущено</span></div>':'<div class="openans">'+esc(r.given)+'</div>';
      }else{
        var given=r.skipped?'<span class="yn">пропущено</span>':'<span class="given '+(r.correct?"right":"wrong")+'">'+esc(r.given)+'</span>';
        var corr=r.correct?'':' <span class="yn">· правильно:</span> <span class="correct-ans">'+esc(r.answer)+'</span>';
        html+='<div class="ans-line"><span class="yn">Відповідь:</span> '+given+corr+'</div>';
      }
      html+='<div class="meta2">'+metaBadges(r)+'</div></div>';
    });
    return html;
  }

  /* ---------------- RESULTS (parent) ---------------- */
  function renderResults(c){
    if(!parentStudent)parentStudent=STUDENTS[0].id;
    var chips=STUDENTS.map(function(s){var n=Object.keys(resultsOf(s.id)).length;return '<button class="tab'+(s.id===parentStudent?" sel":"")+'" data-ps="'+s.id+'">'+s.em+' '+s.name+' · '+n+'</button>';}).join("");
    var syncNote=syncMode==="local"?'<div class="banner warn">Зараз немає звʼязку із сервером — показано збережені дані цього пристрою. Нові результати підтягнуться, щойно звʼязок відновиться.</div>':'';
    c.innerHTML='<h2 class="vt">Результати</h2><p class="vsub">Звіти по кожному уроку: правильно/неправильно, час і як введено відповідь.</p>'+syncNote+
      '<div class="tabs" style="margin-bottom:18px">'+chips+'</div><div id="stud-res"></div>'+parentTools();
    c.querySelectorAll("[data-ps]").forEach(function(b){b.onclick=function(){parentStudent=b.dataset.ps;renderHome();};});
    renderStudentRes(document.getElementById("stud-res"),parentStudent);
    bindParentTools(c);
  }
  function renderStudentRes(box,sid){
    var res=resultsOf(sid);
    var done=DAYS.filter(function(d){return res[d.id];});
    if(!done.length){box.innerHTML='<div class="empty">'+studName(sid)+' ще не пройшов(-ла) жодного уроку.</div>';return;}
    var totC=0,totN=0,totMs=0,totPaste=0,totSusp=0;done.forEach(function(d){var r=res[d.id];totC+=r.correct;totN+=r.total;totMs+=r.totalMs;totPaste+=r.records.filter(function(x){return x.pasted;}).length;totSusp+=r.records.filter(suspicious).length;});
    var html='<div class="jsum"><div class="b"><div class="n">'+done.length+'</div><div class="l">уроків пройдено</div></div>'+
      '<div class="b"><div class="n">'+(totN?Math.round(totC/totN*100)+'%':'—')+'</div><div class="l">правильних ('+totC+'/'+totN+')</div></div>'+
      '<div class="b"><div class="n">'+fmtTime(totMs)+'</div><div class="l">загальний час</div></div>'+
      (totSusp?'<div class="b"><div class="n" style="color:var(--bad)">⚠ '+totSusp+'</div><div class="l">на перевірку</div></div>':'')+'</div>';
    done.slice().reverse().forEach(function(d){var r=res[d.id];var pastes=r.records.filter(function(x){return x.pasted;}).length;var susp=r.records.filter(suspicious).length;
      var sub2=new Date(r.completedAt).toLocaleDateString("uk-UA")+' · '+fmtTime(r.totalMs)+(pastes?' · 📋 '+pastes:'')+(susp?' · ⚠ '+susp:'')+(r.openCount?' · ✎ '+r.openCount:'');
      html+='<div class="jitem" data-id="'+d.id+'"><div class="jhead"><div class="jn"><h4>'+d.title+'</h4><p>'+sub2+'</p></div><span class="sc">'+r.correct+'/'+r.total+'</span><span class="arr">▾</span></div><div class="jbody"></div></div>';
    });
    box.innerHTML=html;
    box.querySelectorAll(".jitem").forEach(function(it){var head=it.querySelector(".jhead"),body=it.querySelector(".jbody"),id=it.dataset.id;
      head.onclick=function(){var open=it.classList.toggle("open");if(open&&!body.dataset.f){body.innerHTML=journalDetail(res[id]);body.dataset.f="1";}};});
  }
  function parentTools(){return '<div class="toolbar"><button class="bigbtn" id="export" style="font-size:14px;padding:10px 16px">⬇ Експорт результатів</button><button class="reset" id="reset">Очистити всі результати</button></div><p class="note" style="margin-top:8px">'+(syncMode==="local"?"⚠ Офлайн — зміни збережуться локально й синхронізуються згодом.":"Оновлюється автоматично, коли учень завершує урок. «Експорт» — вивантажити результати файлом (напр., щоб надіслати Claude).")+'</p>';}
  function bindParentTools(c){
    var b=c.querySelector("#reset");if(b)b.onclick=function(){if(!confirm("Очистити всі результати? Це не можна відмінити."))return;state.results={};persist(null,function(){renderHome();});};
    var e=c.querySelector("#export");if(e)e.onclick=exportData;
  }
  function exportData(){
    var payload={exportedAt:new Date().toISOString(),students:{},results:state.results};
    STUDENTS.forEach(function(x){payload.students[x.id]=x.name;});
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="navchalnyy-rezultaty.json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
  }
  function journalDetail(rep){
    var html='<p class="flags-legend">⌨ вручну · 📋 вставлено (копіюванням) · ✎ N прав. — стільки разів стирав і міняв відповідь · ⚠ перевір — підозріло (вставлено або надто швидко) · ✎ синій — письмове завдання (перевірте текст)</p>';
    ["m","e","g","h"].forEach(function(k){var p=rep.perSub[k];if(!p.n&&!p.open)return;var sub=SUB[k];var line=(p.n?p.c+'/'+p.n+' правильно':'')+(p.open?((p.n?' · ':'')+p.open+' письм.'):'');html+='<div class="qrow" style="box-shadow:none"><div class="top2"><span class="tag2 '+sub[1]+'">'+sub[0]+'</span><span class="qn" style="font-weight:600">'+line+'</span><span class="pill">⏱ '+fmtTime(p.ms)+'</span></div></div>';});
    html+=qrows(rep);return html;
  }

  /* ---------------- PROGRAM / PLAN ---------------- */
  function renderProgram(c){
    var h='<h2 class="vt">Програма на півроку</h2><p class="vsub">Повний маршрут: 24 тижні, 6 модулів.</p>';
    MODULES.forEach(function(m){var rows="";m.rows.forEach(function(r){rows+='<tr><th>'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>';});
      h+='<div class="mod"><div class="mod-head"><span class="mnum">'+m.n+'</span><h3>'+m.title+'</h3><span class="wk">Тижні '+m.wk[0]+'–'+m.wk[1]+'</span></div><div class="scroll"><table class="prog"><thead><tr><th>Тиж.</th><th class="cm">Математика</th><th class="ce2">Англійська</th><th class="cg2">Географія</th><th class="ch2">Історія</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';});
    c.innerHTML=h;
  }
  function renderPlan(c){
    c.innerHTML='<h2 class="vt">План дня</h2><p class="vsub">60 хвилин, чотири предмети по 15. Математика й англійська — щодня; географія й історія — через цікавість.</p>'+
      '<div class="pcard p-m"><div class="ph"><h4>Математика</h4><span class="tm">15 хв</span></div><div class="pb2"><div class="pstep"><span class="tt">0–5 хв</span><span>Розминка: картки на таблицю множення.</span></div><div class="pstep"><span class="tt">5–15 хв</span><span>3–5 прикладів. Помилку розбираємо одразу.</span></div></div></div>'+
      '<div class="pcard p-e"><div class="ph"><h4>Англійська</h4><span class="tm">15 хв</span></div><div class="pb2"><div class="pstep"><span class="tt">0–5 хв</span><span>5 нових слів однієї теми.</span></div><div class="pstep"><span class="tt">5–15 хв</span><span>Короткий текст і 2–3 свої речення.</span></div></div></div>'+
      '<div class="pcard p-g"><div class="ph"><h4>Географія</h4><span class="tm">15 хв</span></div><div class="pb2"><div class="pstep"><span class="tt">0–15 хв</span><span>Карта: континент → країни → столиці → факт про природу.</span></div></div></div>'+
      '<div class="pcard p-h"><div class="ph"><h4>Історія</h4><span class="tm">15 хв</span></div><div class="pb2"><div class="pstep"><span class="tt">0–15 хв</span><span>Історія → переказ своїми словами → місце на карті.</span></div></div></div>'+
      '<footer>Це маршрут, а не жорсткий графік. Втомився — краще зупинитись раніше. Головне — щоденність.</footer>';
  }

  /* ---------------- INIT ---------------- */
  renderRoot();
  loadRemote(true);
  setInterval(function(){if(!run)loadRemote(true);},15000);

}
appMain();
</script>
